name: build-apk

# Builds a debug APK on every push. The debug build installs next to the official
# Field Book (package suffix ".debug").
# Download on a phone: Releases page > "teste-<branch>" > FieldBook-<branch>.apk
# (each push replaces that pre-release). Also kept as a workflow artifact.

on:
  push:
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # to publish the test pre-release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # The gradle-wrapper.jar committed upstream fails Gradle's wrapper checksum validation,
      # so it is never executed here: Gradle itself is installed at the wrapper's version.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.11.1"
          validate-wrappers: false

      # app/build.gradle reads local.properties, which is not committed
      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      # Each Gradle run is logged; on failure the important lines become an annotation,
      # readable from the run page and the API without downloading the full log.
      - name: Unit tests (calculated traits)
        run: .github/workflows/scripts/gradle-annotate.sh :app:testDebugUnitTest --tests "com.fieldbook.tracker.traits.calculated.*"

      - name: Build debug APK
        run: .github/workflows/scripts/gradle-annotate.sh :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: field-book-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      # A pre-release gives a direct download link that works from the phone's browser
      - name: Publish test pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          safe=$(echo "$BRANCH" | tr -c 'A-Za-z0-9._-' '-' | sed 's/-*$//')
          tag="teste-$safe"
          apk="FieldBook-$safe.apk"
          cp app/build/outputs/apk/debug/*.apk "$apk"
          gh release delete "$tag" --cleanup-tag --yes || true
          gh release create "$tag" "$apk" --prerelease --target "$GITHUB_SHA" \
            --title "Teste: $BRANCH" \
            --notes "Versão de teste do branch $BRANCH (commit ${GITHUB_SHA::7}). Instala ao lado do Field Book oficial."
