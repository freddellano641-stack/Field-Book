name: build-apk

# Builds a debug APK on every push and keeps it as a downloadable artifact.
# The debug build installs next to the official Field Book (package suffix ".debug").
# To download: Actions tab > latest "build-apk" run > Artifacts > field-book-debug-apk.

on:
  push:
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # The gradle-wrapper.jar committed upstream fails Gradle's wrapper checksum validation,
      # so it is never executed here: Gradle itself is installed at the wrapper's version.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.11.1"
          validate-wrappers: false

      - name: Unit tests (calculated traits)
        run: gradle --no-daemon :app:testDebugUnitTest --tests "com.fieldbook.tracker.traits.calculated.*"

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: field-book-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
